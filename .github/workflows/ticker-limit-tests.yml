name: Ticker limit tests
on:
  push:
    branches: [main]
    paths:
      - scripts/market_service.py
      - tests/test_market_service.py
      - .github/workflows/ticker-limit-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ticker configuration limits
        run: python -m unittest discover -s tests -p 'test_market_service.py' -v
