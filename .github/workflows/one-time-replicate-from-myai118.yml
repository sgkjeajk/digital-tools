name: One-time protected repository replication

on:
  push:
    paths:
      - ".github/workflows/one-time-replicate-from-myai118.yml"

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone protected source snapshot
        run: |
          git clone --depth 1 --branch backup/before-myai118-replication-20261027 \
            https://github.com/myai118/digital-tools.git /tmp/myai118-source

      - name: Replace target with protected source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rsync -a --delete --exclude=".git/" /tmp/myai118-source/ ./
            git add -A

            if git diff --cached --quiet; then
              echo "Target already matches the protected source snapshot."
              exit 0
            fi

            git commit -m "Synchronize with protected myai118 snapshot"
            if git push origin HEAD:main; then
              exit 0
            fi

            sleep 5
          done

          echo "Unable to update main after five attempts." >&2
          exit 1
