name: Update Stock ETF Monitor
on:
  push:
    branches: [main]
    paths:
      - data/stock-tickers.json
      - scripts/market_service.py
      - scripts/google_price_fallback.py
      - scripts/github_market_update.py
      - .github/workflows/stock-monitor.yml
      - .github/workflows/stock-monitor-watchdog.yml
  schedule:
    # Redundant wake-ups improve reliability; Python keeps price scraping fresh for 15 minutes
    # and only publishes heartbeat updates when the last successful check is old enough.
    - cron: '1-56/5 * * * *'
    - cron: '4-59/5 * * * *'
    - cron: '7-57/5 * * * *'
    # Full historical highs: 08:00, 14:00 and 20:00 SGT.
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      lookupTicker:
        description: Optional ticker-only metadata lookup
        required: false
        default: ''
        type: string
      requestId:
        description: Optional browser request correlation ID
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: stock-etf-monitor-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve verified market data or metadata
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          LOOKUP_TICKER: ${{ inputs.lookupTicker }}
          REQUEST_ID: ${{ inputs.requestId }}
          REFRESH_ATH: ${{ github.event_name != 'schedule' || github.event.schedule == '0 0,6,12 * * *' }}
        run: |
          run_count=1
          if [ "$TRIGGER_EVENT" = "schedule" ] && [ -z "$LOOKUP_TICKER" ]; then
            run_count=15
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 "$run_count"); do
            echo "Stock monitor checker cycle $attempt of $run_count"
            python scripts/github_market_update.py
            git fetch origin main
            if [ "$(git rev-parse HEAD:data/stock-tickers.json)" != "$(git rev-parse origin/main:data/stock-tickers.json)" ]; then
              echo 'A newer configuration exists; its queued update will handle prices.'
              exit 0
            fi
            git add market-data.json data/stock-monitor.json data/lookups
            if ! git diff --cached --quiet; then
              git commit -m 'Update Stock ETF Monitor shared result'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            if [ "$attempt" -lt "$run_count" ]; then
              sleep 360
            fi
          done
