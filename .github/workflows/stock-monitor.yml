name: Update Stock ETF Monitor
on:
  push:
    branches: [main]
    paths:
      - data/stock-tickers.json
      - scripts/market_service.py
      - scripts/google_price_fallback.py
      - scripts/github_market_update.py
      - .github/workflows/stock-monitor.yml
  schedule:
    # Five-minute checks plus offset checks; open-market price freshness is checked in Python.
    - cron: '2-57/5 * * * *'
    # Additional offset checks (GitHub scheduling is still best effort).
    - cron: '4,19,34,49 * * * *'
    # Full historical highs: 08:00, 14:00 and 20:00 SGT.
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:
    inputs:
      lookupTicker:
        description: Optional ticker-only metadata lookup
        required: false
        default: ''
        type: string
      requestId:
        description: Optional browser request correlation ID
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: stock-etf-monitor-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Google Finance browser fallback
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Retrieve verified market data or metadata
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          LOOKUP_TICKER: ${{ inputs.lookupTicker }}
          REQUEST_ID: ${{ inputs.requestId }}
          REFRESH_ATH: ${{ github.event_name != 'schedule' || github.event.schedule == '0 0,6,12 * * *' }}
        run: python scripts/github_market_update.py
      - name: Commit shared result without overwriting a newer ticker list
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD:data/stock-tickers.json)" != "$(git rev-parse origin/main:data/stock-tickers.json)" ]; then
            echo 'A newer configuration exists; its queued update will handle prices.'
            exit 0
          fi
          git add market-data.json data/stock-monitor.json data/lookups
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Stock ETF Monitor shared result'
          git pull --rebase origin main
          git push origin HEAD:main
