name: One-time Dividend Refresh
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dividend-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh dividends and yields
        env:
          REFRESH_DIVIDENDS: 'true'
          REFRESH_ATH: 'false'
          TRIGGER_EVENT: 'workflow_dispatch'
          REQUEST_ID: one-time-dividend-refresh
        run: python scripts/github_market_update.py
      - name: Save refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json data/stock-monitor.json data/lookups
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dividend and yield fields'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
