name: Stock Monitor Watchdog
on:
  schedule:
    # Smaller backup launcher. It requests a checker using saved admin settings only when fewer
    # than 3 stock-monitor checker runs are already queued or running.
    - cron: '43 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: stock-etf-monitor-watchdog-launcher
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch price checker when active queue is below limit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: stock-monitor.yml
          MAX_ACTIVE_CHECKERS_DEFAULT: '3'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          workflow = os.environ["WORKFLOW_FILE"]
          try:
              with open("data/stock-tickers.json", encoding="utf-8") as f:
                  cfg = json.load(f)
              limit = int(cfg.get("priceChecker", {}).get("maxActiveCheckers", os.environ.get("MAX_ACTIVE_CHECKERS_DEFAULT", "3")))
          except Exception as error:
              print(f"Could not read max active checker setting; using default. {error}")
              limit = int(os.environ.get("MAX_ACTIVE_CHECKERS_DEFAULT", "3"))
          limit = max(1, min(10, limit))
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      content = response.read().decode("utf-8")
                      return json.loads(content) if content else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub API {method} {url} failed: {exc.code} {detail}")

          base = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs"
          active = []
          for status in ("queued", "in_progress"):
              payload = request("GET", f"{base}?status={status}&per_page=100")
              active.extend(payload.get("workflow_runs", []))

          unique = {run["id"]: run for run in active}
          count = len(unique)
          print(f"Active stock monitor price-checker runs: {count} / {limit}")
          for run in sorted(unique.values(), key=lambda x: x.get("created_at", "")):
              print(f"- {run['id']} {run['status']} {run.get('event')} {run.get('created_at')} {run.get('html_url')}")

          if count >= limit:
              print("Queue limit reached; no new price checker dispatched.")
              raise SystemExit(0)

          request_id = "watchdog-" + dt.datetime.now(dt.timezone.utc).strftime("%Y%m%d%H%M%S")
          dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
          request("POST", dispatch_url, {"ref": "main", "inputs": {"lookupTicker": "", "requestId": request_id}})
          print(f"Dispatched one new price checker using saved admin settings: {request_id}")
          PY
