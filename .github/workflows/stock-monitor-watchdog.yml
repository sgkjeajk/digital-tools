name: Stock Monitor Watchdog
on:
  schedule:
    # Backup schedule for the main updater. GitHub schedules are best effort,
    # so this independent workflow gives the heartbeat another chance to run.
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-etf-monitor-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scheduled stock monitor heartbeat
        env:
          TRIGGER_EVENT: schedule
          REFRESH_ATH: false
        run: |
          run_count=30
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git show origin/main:market-data.json > /tmp/market-data.json 2>/dev/null; then
            if python -c "import datetime as dt, json, sys; data=json.load(open('/tmp/market-data.json', encoding='utf-8')); timestamp=data.get('last_check_completed_at') or data.get('generated_at'); checked_at=dt.datetime.fromisoformat(timestamp.replace('Z', '+00:00')) if timestamp else None; age=(dt.datetime.now(dt.timezone.utc)-checked_at).total_seconds() if checked_at else 999999; print(f'Latest stock monitor check age: {age / 60:.1f} minutes'); sys.exit(0 if age < 600 else 1)"
            then
              echo 'Recent successful check found; queued watchdog run can stop.'
              exit 0
            fi
          fi
          for attempt in $(seq 1 "$run_count"); do
            echo "Stock monitor watchdog checker cycle $attempt of $run_count"
            python scripts/github_market_update.py
            git fetch origin main
            if [ "$(git rev-parse HEAD:data/stock-tickers.json)" != "$(git rev-parse origin/main:data/stock-tickers.json)" ]; then
              echo 'A newer configuration exists; its queued update will handle prices.'
              exit 0
            fi
            git add market-data.json data/stock-monitor.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update Stock Monitor watchdog heartbeat'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            if [ "$attempt" -lt "$run_count" ]; then
              sleep 480
            fi
          done
