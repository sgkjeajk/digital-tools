name: Google current price forced fallback integration (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/google-forced-price-fallback.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Force both Yahoo current-price routes to fail, validate Google fallback for 19 tickers
        run: |
          python - <<'PY'
          import sys,json,datetime as dt
          from unittest.mock import patch
          sys.path.insert(0,'scripts')
          import market_service as m
          cfg=m.read_config()
          tickers=[x['ticker'] for x in cfg['instruments'] if x['enabled']]
          def fail(*args,**kwargs):raise ValueError('CONTROLLED YAHOO FAILURE')
          passed=0
          with patch.object(m,'quote_webpage',side_effect=fail),patch.object(m,'quote_chart',side_effect=fail):
            for ticker in tickers:
              try:
                data=m.quote(ticker)
                assert data['source'] in ('Google Finance individual ticker webpage','Google Finance individual ticker (rendered)')
                assert data['current_price']>0
                assert data['currency']==('SGD' if ticker.endswith('.SI') else 'USD')
                assert data['prev_close'] is None or data['prev_close']>0
                stamp=dt.datetime.fromisoformat(data['price_as_of'])
                assert stamp.tzinfo is not None
                passed+=1
                print('GOOGLE_FORCED_FALLBACK',json.dumps({'ticker':ticker,'passed':True,'price':data['current_price'],'currency':data['currency'],'quote_as_of':data['price_as_of']}),flush=True)
              except Exception as e:
                print('GOOGLE_FORCED_FALLBACK',json.dumps({'ticker':ticker,'passed':False,'error':str(e)[:400]}),flush=True)
          print('GOOGLE_FORCED_FALLBACK_SUMMARY',json.dumps({'passed':passed,'total':len(tickers),'production_data_unchanged':True}),flush=True)
          if passed!=len(tickers):raise SystemExit(1)
          PY
