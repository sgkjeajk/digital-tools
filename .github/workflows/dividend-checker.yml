name: Daily Dividend Checker
on:
  schedule:
    # 06:15 and 07:15 Singapore time (UTC+8).
    - cron: '15 22 * * *'
    - cron: '15 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dividend-data-update
  cancel-in-progress: false
jobs:
  dividends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip backup when successful first run is fresh
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime as dt,json,os,pathlib
          skip=False
          if os.environ.get('SCHEDULE')=='15 23 * * *':
              p=pathlib.Path('dividend-data.json')
              if p.exists():
                  try:
                      data=json.loads(p.read_text())
                      generated=dt.datetime.fromisoformat(data['generated_at'].replace('Z','+00:00'))
                      age=(dt.datetime.now(dt.timezone.utc)-generated).total_seconds()
                      skip=0<=age<2*3600 and all(not row.get('dividend_error') for row in data.get('instruments',[]))
                  except (ValueError,KeyError,TypeError): pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('skip='+str(skip).lower()+'\n')
          PY
      - name: Retrieve dividend information
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/dividend_update.py
      - name: Save dividend-only snapshot
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dividend-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update standalone dividend data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
